<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VocabMaster - 英単語学習アプリ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans selection:bg-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- SVG Icon Components ---
    const IconBase = ({ size = 24, className = "", fill = "none", children, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
        {children}
      </svg>
    );

    const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
    const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"/></IconBase>;
    const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
    const Database = (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></IconBase>;
    const RefreshCw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;
    const Volume2 = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></IconBase>;
    const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;
    const X = (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
    const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>;
    const Headphones = (props) => <IconBase {...props}><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></IconBase>;
    const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const Pause = (props) => <IconBase {...props}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></IconBase>;
    const SkipForward = (props) => <IconBase {...props}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></IconBase>;
    const SkipBack = (props) => <IconBase {...props}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></IconBase>;
    const BarChart2 = (props) => <IconBase {...props}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconBase>;
    const AlertCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>;
    const Info = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>;
    const Filter = (props) => <IconBase {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></IconBase>;
    const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
    
    // Sort Icons
    const ChevronUp = (props) => <IconBase {...props}><polyline points="18 15 12 9 6 15"/></IconBase>;
    const ChevronDown = (props) => <IconBase {...props}><polyline points="6 9 12 15 18 9"/></IconBase>;
    const ChevronsUpDown = (props) => <IconBase {...props}><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></IconBase>;

    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    };

    // --- Main App Component ---
    function App() {
      // --- States ---
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem('vocab_words');
        return saved ? JSON.parse(saved) : [];
      });

      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('vocab_settings');
        return saved ? JSON.parse(saved) : {
          order: 'registered',
          limit: '20',
          excludePerfect: true, // デフォルトで完璧な単語を除外するように変更
          accuracyMin: 0,
          accuracyMax: 100,
          correctCountMin: 0,
          correctCountMax: '',
          speechRate: 1.0,
          autoSpeak: true,
          listeningInterval: 2.0,
          excludedCategories: []
        };
      });

      const [view, setView] = useState('dashboard');
      const [importText, setImportText] = useState('');
      
      const [toast, setToast] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState(null);

      // List Sorting State
      const [sortConfig, setSortConfig] = useState({ key: 'createdAt', direction: 'desc' });

      // --- Bulk Action States (Swipe to select) ---
      const [selectedIds, setSelectedIds] = useState(new Set());
      const dragState = useRef({ isDragging: false, isSelecting: true });
      
      // --- Swipe and Animation State ---
      const [slideDir, setSlideDir] = useState('fade');
      const touchStart = useRef({ x: null, y: null });
      const mainTabs = ['dashboard', 'setup', 'listening_setup', 'import'];

      const changeView = (newView, forceDir = null) => {
        const currentIdx = mainTabs.indexOf(view);
        const newIdx = mainTabs.indexOf(newView);
        if (forceDir) {
          setSlideDir(forceDir);
        } else if (currentIdx !== -1 && newIdx !== -1 && currentIdx !== newIdx) {
          setSlideDir(newIdx > currentIdx ? 'right' : 'left');
        } else {
          setSlideDir('fade');
        }
        setView(newView);
      };

      const handleGlobalTouchStart = (e) => {
        if (dragState.current.isDragging) return;
        // 入力要素や横スクロール要素の上でのスワイプは無視する（誤爆防止）
        if (e.target.closest('textarea, input, select, .overflow-x-auto, table')) return;
        touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };

      const handleGlobalTouchEnd = (e) => {
        if (dragState.current.isDragging) return;
        if (touchStart.current.x === null) return;
        
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        
        const deltaX = touchStart.current.x - touchEndX;
        const deltaY = touchStart.current.y - touchEndY;
        
        // 縦移動が少なく、横方向に60px以上スワイプされた場合
        if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 50) {
          const currentIndex = mainTabs.indexOf(view);
          
          if (currentIndex !== -1) {
            // 左スワイプ（指を左に動かす） = 右のタブへ
            if (deltaX > 0) {
              const nextIndex = (currentIndex + 1) % mainTabs.length;
              changeView(mainTabs[nextIndex], 'right');
            } 
            // 右スワイプ（指を右に動かす） = 左のタブへ
            else if (deltaX < 0) {
              const prevIndex = (currentIndex - 1 + mainTabs.length) % mainTabs.length;
              changeView(mainTabs[prevIndex], 'left');
            }
          }
        }
        touchStart.current = { x: null, y: null };
      };

      const showAlert = (message) => {
        setToast({ message });
        setTimeout(() => setToast(null), 3000);
      };

      // Study State
      const [studyQueue, setStudyQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [sessionResults, setSessionResults] = useState([]);
      const [sessionLearnedIds, setSessionLearnedIds] = useState([]);
      
      // Listening State
      const [listeningState, setListeningState] = useState({ queue: [], currentIndex: 0, isPlaying: false });
      const isPlayingRef = useRef(false);

      // Extract unique categories from words
      const availableCategories = useMemo(() => {
        const cats = new Set(words.map(w => (w.category || '').trim()).filter(Boolean));
        return Array.from(cats).sort();
      }, [words]);

      // --- Effects ---
      useEffect(() => {
        localStorage.setItem('vocab_words', JSON.stringify(words));
      }, [words]);

      useEffect(() => {
        localStorage.setItem('vocab_settings', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        isPlayingRef.current = listeningState.isPlaying;
      }, [listeningState.isPlaying]);

      // Handle Global Mouse/Touch Up for Selection Dragging
      useEffect(() => {
        const handlePointerUp = () => { dragState.current.isDragging = false; };
        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('touchend', handlePointerUp);
        window.addEventListener('mouseup', handlePointerUp);
        return () => {
          window.removeEventListener('pointerup', handlePointerUp);
          window.removeEventListener('touchend', handlePointerUp);
          window.removeEventListener('mouseup', handlePointerUp);
        };
      }, []);

      // Listening Loop Effect
      useEffect(() => {
        if (view !== 'listening' || !listeningState.isPlaying) return;

        let timeoutId;
        let isCancelled = false;

        const playWord = async () => {
          if (listeningState.currentIndex >= listeningState.queue.length) {
            setListeningState(p => ({ ...p, isPlaying: false }));
            return;
          }

          const word = listeningState.queue[listeningState.currentIndex];

          const speakText = (text, lang) => {
            return new Promise(resolve => {
              if (isCancelled) return resolve();
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(cleanText(text));
              utterance.lang = lang;
              utterance.rate = settings.speechRate;
              utterance.onend = resolve;
              utterance.onerror = resolve;
              window.speechSynthesis.speak(utterance);
            });
          };

          await speakText(word.english, 'en-US');
          timeoutId = setTimeout(async () => {
            if (isCancelled || !isPlayingRef.current) return;
            await speakText(word.japanese, 'ja-JP');
            if (isCancelled || !isPlayingRef.current) return;
            timeoutId = setTimeout(() => {
              if (isCancelled || !isPlayingRef.current) return;
              setListeningState(p => ({ ...p, currentIndex: p.currentIndex + 1 }));
            }, 500);
          }, settings.listeningInterval * 1000);
        };

        playWord();

        return () => {
          isCancelled = true;
          clearTimeout(timeoutId);
          window.speechSynthesis.cancel();
        };
      }, [view, listeningState.isPlaying, listeningState.currentIndex, listeningState.queue, settings.speechRate, settings.listeningInterval]);

      // --- Helper Functions ---
      const cleanText = (text) => text.replace(/\[.*?\]|［.*?］/g, '').trim();

      const speak = (text, lang = 'en-US') => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(cleanText(text));
        utterance.lang = lang;
        utterance.rate = settings.speechRate;
        window.speechSynthesis.speak(utterance);
      };

      const getAccuracy = (correct, incorrect) => {
        const total = correct + incorrect;
        if (total === 0) return 0;
        return Math.round((correct / total) * 100);
      };

      // 完璧な単語（マスター済み）の判定：5回以上正答 ＆ 正答率90%以上
      const isPerfect = (word) => {
        const total = word.correctCount + word.incorrectCount;
        if (total === 0) return false;
        return word.correctCount >= 5 && (word.correctCount / total) >= 0.9;
      };

      // --- Handlers ---
      const handleImport = () => {
        const lines = importText.split('\n');
        let addedCount = 0;
        let updatedCount = 0;
        const newWords = [...words];

        lines.forEach(line => {
          if (!line.trim()) return;
          if (line.startsWith('カテゴリー\tNo.') || line.startsWith('カテゴリー\t番号') || line.startsWith('英語\t日本語')) return;

          const parts = line.split('\t');
          let category = '';
          let serialNumber = '';
          let english = '';
          let japanese = '';
          let correctCount = 0;
          let incorrectCount = 0;

          if (parts.length === 2) {
             english = parts[0]?.trim();
             japanese = parts[1]?.trim();
          } else if (parts.length >= 4) {
             category = parts[0]?.trim() || '';
             serialNumber = parts[1]?.trim() || '';
             english = parts[2]?.trim();
             japanese = parts[3]?.trim();
             correctCount = parseInt(parts[4]) || 0;
             incorrectCount = parseInt(parts[5]) || 0;
          } else if (parts.length === 3) {
             category = parts[0]?.trim() || '';
             english = parts[1]?.trim();
             japanese = parts[2]?.trim();
          }

          if (english && japanese) {
            const existingIndex = newWords.findIndex(w => w.english === english && w.japanese === japanese);
            if (existingIndex !== -1) {
               const current = newWords[existingIndex];
               const mergedCorrect = Math.max(current.correctCount || 0, correctCount);
               const mergedIncorrect = Math.max(current.incorrectCount || 0, incorrectCount);
               
               if (current.category !== category || 
                   current.serialNumber !== serialNumber ||
                   current.correctCount !== mergedCorrect || current.incorrectCount !== mergedIncorrect) {
                   newWords[existingIndex] = { 
                     ...current, 
                     category, 
                     serialNumber,
                     correctCount: mergedCorrect,
                     incorrectCount: mergedIncorrect
                   };
                   updatedCount++;
               }
            } else {
              newWords.push({
                id: generateId(),
                english,
                japanese,
                category,
                serialNumber,
                correctCount,
                incorrectCount,
                createdAt: Date.now()
              });
              addedCount++;
            }
          }
        });

        setWords(newWords);
        setImportText('');
        if (addedCount > 0 || updatedCount > 0) {
           showAlert(`${addedCount}語を追加、${updatedCount}語を更新しました！`);
        } else {
           showAlert('追加・更新可能な単語が見つかりませんでした。');
        }
        changeView('dashboard');
      };

      const handleExport = () => {
        if (words.length === 0) {
          showAlert('エクスポートするデータがありません。');
          return;
        }

        const tsvHeader = "カテゴリー\t番号\t英語\t意味(日本語)\t正解数\t不正解数\n";
        const tsvData = words.map(w => 
          `${w.category || ''}\t${w.serialNumber || ''}\t${w.english}\t${w.japanese}\t${w.correctCount}\t${w.incorrectCount}`
        ).join('\n');
        
        const content = tsvHeader + tsvData;
        const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        a.download = `VocabMaster_Export_${dateStr}.tsv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showAlert('データをエクスポートしました。');
      };

      const handleDeleteAll = () => {
        setConfirmDialog({
          message: 'すべての単語データを削除します。よろしいですか？',
          onConfirm: () => {
            setWords([]);
            setSelectedIds(new Set());
            setConfirmDialog(null);
            showAlert('全データを削除しました。');
          }
        });
      };

      const handleBulkDelete = () => {
        setConfirmDialog({
          message: `選択した ${selectedIds.size} 件の単語を削除してもよろしいですか？`,
          onConfirm: () => {
            setWords(prev => prev.filter(w => !selectedIds.has(w.id)));
            setSelectedIds(new Set());
            setConfirmDialog(null);
            showAlert(`${selectedIds.size}件の単語を削除しました。`);
          }
        });
      };

      const handleResetWord = (id) => {
        setConfirmDialog({
          message: 'この単語の学習履歴をリセットしてもよろしいですか？',
          onConfirm: () => {
            setWords(prev => prev.map(w => w.id === id ? { ...w, correctCount: 0, incorrectCount: 0 } : w));
            setConfirmDialog(null);
            showAlert('学習履歴をリセットしました。');
          }
        });
      };

      const handleBulkReset = () => {
        setConfirmDialog({
          message: `選択した ${selectedIds.size} 件の単語の学習履歴をリセットしてもよろしいですか？`,
          onConfirm: () => {
            setWords(prev => prev.map(w => selectedIds.has(w.id) ? { ...w, correctCount: 0, incorrectCount: 0 } : w));
            setSelectedIds(new Set());
            setConfirmDialog(null);
            showAlert(`${selectedIds.size}件の学習履歴をリセットしました。`);
          }
        });
      };

      const handleDeleteWord = (id) => {
        setConfirmDialog({
          message: 'この単語を削除してもよろしいですか？',
          onConfirm: () => {
            setWords(prev => prev.filter(w => w.id !== id));
            setSelectedIds(prev => {
              const next = new Set(prev);
              next.delete(id);
              return next;
            });
            setConfirmDialog(null);
            showAlert('単語を削除しました。');
          }
        });
      };

      // --- Selection Drag Handlers ---
      const handleRowPointerDown = (e, id) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return; // Only left click for mouse
        const isSelected = selectedIds.has(id);
        dragState.current = { isDragging: true, isSelecting: !isSelected };
        
        setSelectedIds(prev => {
          const next = new Set(prev);
          !isSelected ? next.add(id) : next.delete(id);
          return next;
        });
      };

      const handleRowPointerEnter = (e, id) => {
        if (e.pointerType === 'touch') return; // Touch uses TouchMove
        if (!dragState.current.isDragging) return;
        
        setSelectedIds(prev => {
          const next = new Set(prev);
          dragState.current.isSelecting ? next.add(id) : next.delete(id);
          return next;
        });
      };

      const handleTableTouchMove = (e) => {
        if (!dragState.current.isDragging) return;
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (!el) return;
        const tr = el.closest('tr[data-word-id]');
        if (tr) {
          const id = tr.getAttribute('data-word-id');
          if (id) {
            setSelectedIds(prev => {
              const next = new Set(prev);
              dragState.current.isSelecting ? next.add(id) : next.delete(id);
              return next;
            });
          }
        }
      };


      const generateQueue = (excludeIds = [], ignoreLimit = false) => {
        let filtered = [...words];

        if (excludeIds.length > 0) {
          filtered = filtered.filter(w => !excludeIds.includes(w.id));
        }

        const excludedCategories = settings.excludedCategories || [];
        if (excludedCategories.length > 0) {
           filtered = filtered.filter(w => !excludedCategories.includes((w.category || '').trim()));
        }

        if (settings.excludePerfect) {
          filtered = filtered.filter(w => !isPerfect(w)); // 完璧な単語を除外
        }

        filtered = filtered.filter(w => {
          const total = w.correctCount + w.incorrectCount;
          const rate = total === 0 ? 0 : (w.correctCount / total) * 100;
          return rate >= settings.accuracyMin && rate <= settings.accuracyMax;
        });

        filtered = filtered.filter(w => {
          const max = settings.correctCountMax === '' ? Infinity : Number(settings.correctCountMax);
          return w.correctCount >= settings.correctCountMin && w.correctCount <= max;
        });

        if (settings.order === 'random') {
          filtered.sort(() => Math.random() - 0.5);
        } else if (settings.order === 'weakest') {
          filtered.sort((a, b) => {
            const rateA = getAccuracy(a.correctCount, a.incorrectCount);
            const rateB = getAccuracy(b.correctCount, b.incorrectCount);
            if (rateA === rateB) return (a.correctCount + a.incorrectCount) - (b.correctCount + b.incorrectCount);
            return rateA - rateB;
          });
        } else {
          filtered.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        }

        if (!ignoreLimit && settings.limit !== 'all') {
          filtered = filtered.slice(0, Number(settings.limit));
        }

        return filtered;
      };

      const startStudy = () => {
        setSessionLearnedIds([]);
        const queue = generateQueue([]);
        if (queue.length === 0) {
          showAlert('条件に一致する単語がありません。フィルタリング設定を変更してください。');
          return;
        }
        setStudyQueue(queue);
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionResults([]);
        setView('study');
        if (settings.autoSpeak) speak(queue[0].english);
      };

      const startListening = () => {
        const queue = generateQueue();
        if (queue.length === 0) {
          showAlert('条件に一致する単語がありません。フィルタリング設定を変更してください。');
          return;
        }
        setListeningState({ queue, currentIndex: 0, isPlaying: true });
        setView('listening');
      };

      const handleAnswer = (isCorrect) => {
        const currentWord = studyQueue[currentIndex];
        setSessionResults(prev => [...prev, { wordId: currentWord.id, isCorrect, word: currentWord }]);

        if (currentIndex + 1 < studyQueue.length) {
          setCurrentIndex(prev => prev + 1);
          setIsFlipped(false);
          if (settings.autoSpeak) speak(studyQueue[currentIndex + 1].english);
        } else {
          finishStudy([...sessionResults, { wordId: currentWord.id, isCorrect, word: currentWord }]);
        }
      };

      const finishStudy = (finalResults = sessionResults) => {
        setWords(prevWords => {
          return prevWords.map(word => {
            const result = finalResults.find(r => r.wordId === word.id);
            if (result) {
              return {
                ...word,
                correctCount: word.correctCount + (result.isCorrect ? 1 : 0),
                incorrectCount: word.incorrectCount + (result.isCorrect ? 0 : 1),
              };
            }
            return word;
          });
        });
        setSessionResults(finalResults);
        setView('result');
      };

      const handleRetrySession = () => {
        const queue = sessionResults.map(r => r.word);
        setStudyQueue(queue);
        setCurrentIndex(0);
        setIsFlipped(false);
        setSessionResults([]);
        changeView('study');
        if (settings.autoSpeak) speak(queue[0].english);

      const handleRetryIncorrect = () => {
        const incorrectResults = sessionResults.filter(r => !r.isCorrect);

              const totalA = a.correctCount + a.incorrectCount;

                        <button onClick={() => setAllCategories(false)} className="text-xs font-bold bg-white border border-gray-300 px-3 py-1.5 rounded hover:bg-gray-100 transition">すべて外す</button>
                      </div>
                      <div className="flex flex-wrap gap-3 max-h-48 overflow-y-auto pr-2">
                        {availableCategories.map(cat => {
                          const isChecked = !currentExcluded.includes(cat);
                          return (
                            <label key={cat} className={`flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer border transition-colors ${isChecked ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-gray-200 opacity-70 hover:bg-gray-50'}`}>
                              <input 
                                type="checkbox" 
                                className="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500"
                                checked={isChecked}
                                onChange={() => toggleCategory(cat)}
                              />
                              <span className="text-sm font-medium text-gray-800">{cat || '(カテゴリーなし)'}</span>
                            </label>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                <hr className="border-gray-100" />

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">問題数</label>
                    <select 
                      className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                      value={settings.limit}
                      onChange={(e) => setSettings({...settings, limit: e.target.value})}
                    >
                      <option value="10">10問</option>
                      <option value="20">20問</option>
                      <option value="50">50問</option>
                      <option value="all">全問（条件に合うものすべて）</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">出題順</label>
                    <select 
                      className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                      value={settings.order}
                      onChange={(e) => setSettings({...settings, order: e.target.value})}
                    >
                      <option value="registered">登録順</option>
                      <option value="random">ランダム</option>
                      <option value="weakest">苦手優先（正答率が低い順）</option>
                    </select>
                  </div>
                </div>

                <hr className="border-gray-100" />

                <div>
                  <h3 className="font-bold text-gray-800 mb-4">詳細フィルタリング</h3>
                  
                  <label className="flex items-center gap-3 p-3 bg-gray-50 rounded-lg mb-4 cursor-pointer hover:bg-gray-100 transition border border-gray-200">
                    <input 
                      type="checkbox" 
                      className="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500"
                      checked={settings.excludePerfect}
                      onChange={(e) => setSettings({...settings, excludePerfect: e.target.checked})}
                    />
                    <div>
                      <div className="font-semibold text-gray-800">マスターした単語を除外する（基本推奨）</div>
                      <div className="text-xs text-gray-500">正解数5回以上かつ正答率90%以上の単語を出題しません。総復習したい場合はチェックを外してください。</div>
                    </div>
                  </label>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">正答率の範囲 (%)</label>
                      <div className="flex items-center gap-2">
                        <input type="number" min="0" max="100" className="w-full p-2 border border-gray-300 rounded-lg" value={settings.accuracyMin} onChange={e => setSettings({...settings, accuracyMin: Number(e.target.value)})} />
                        <span className="text-gray-500">〜</span>
                        <input type="number" min="0" max="100" className="w-full p-2 border border-gray-300 rounded-lg" value={settings.accuracyMax} onChange={e => setSettings({...settings, accuracyMax: Number(e.target.value)})} />
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-2">正解回数の範囲 (回)</label>
                      <div className="flex items-center gap-2">
                        <input type="number" min="0" className="w-full p-2 border border-gray-300 rounded-lg" value={settings.correctCountMin} onChange={e => setSettings({...settings, correctCountMin: Number(e.target.value)})} />
                        <span className="text-gray-500">〜</span>
                        <input type="number" min="0" placeholder="上限なし" className="w-full p-2 border border-gray-300 rounded-lg" value={settings.correctCountMax} onChange={e => setSettings({...settings, correctCountMax: e.target.value})} />
                      </div>
                    </div>
                  </div>
                </div>

                <hr className="border-gray-100" />

                <div>
                  <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <Volume2 size={18} className="text-indigo-600"/> 音声設定
                  </h3>
                  
                  <div className="mb-4">
                    <div className="flex justify-between items-center mb-2">
                      <label className="text-sm font-bold text-gray-700">読み上げスピード ({settings.speechRate.toFixed(1)}x)</label>
                      <button onClick={() => speak("Speed test.", 'en-US')} className="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700 transition">テスト再生</button>
                    </div>
                    <input 
                      type="range" min="0.5" max="2.0" step="0.1" 
                      className="w-full accent-indigo-600"
                      value={settings.speechRate}
                      onChange={(e) => setSettings({...settings, speechRate: parseFloat(e.target.value)})}
                    />
                    <div className="flex justify-between text-xs text-gray-400 mt-1">
                      <span>0.5x (遅い)</span>
                      <span>1.0x (標準)</span>
                      <span>2.0x (速い)</span>
                    </div>
                  </div>

                  {!isListeningMode && (
                    <label className="flex items-center gap-3 cursor-pointer">
                      <input 
                        type="checkbox" 
                        className="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500"
                        checked={settings.autoSpeak}
                        onChange={(e) => setSettings({...settings, autoSpeak: e.target.checked})}
                      />
                      <span className="text-sm font-medium text-gray-700">出題時に自動で読み上げる</span>
                    </label>
                  )}

                  {isListeningMode && (
                    <div className="mt-4">
                      <label className="block text-sm font-bold text-gray-700 mb-2">単語間のインターバル (秒)</label>
                      <input 
                        type="range" min="0.5" max="5.0" step="0.5" 
                        className="w-full accent-indigo-600"
                        value={settings.listeningInterval}
                        onChange={(e) => setSettings({...settings, listeningInterval: parseFloat(e.target.value)})}
                      />
                      <div className="text-center text-indigo-600 font-bold mt-1">{settings.listeningInterval.toFixed(1)} 秒</div>
                    </div>
                  )}
                </div>

                <div className="pt-4">
                  <div className={`text-center text-sm font-bold mb-4 border py-4 rounded-xl ${isListeningMode ? 'bg-purple-50 border-purple-100 text-purple-800' : 'bg-indigo-50 border-indigo-100 text-indigo-800'}`}>
                    現在の条件で対象となる単語: <span className={`text-3xl mx-1 ${isListeningMode ? 'text-purple-600' : 'text-indigo-600'}`}>{filteredCount}</span> 語
                    {filteredCount > 0 && settings.limit !== 'all' && (
                      <div className="text-gray-500 font-normal text-xs mt-2">
                        ※ この中から <span className="font-bold">{actualLimit}</span> 語が {settings.order === 'random' ? 'ランダムに' : settings.order === 'weakest' ? '苦手な順に' : '登録順に'} 出題されます
                      </div>
                    )}
                    {filteredCount === 0 && (
                      <div className="text-rose-500 font-normal text-xs mt-2">
                        ※ 条件に一致する単語がありません。設定を見直してください。
                      </div>
                    )}
                  </div>

                  <button 
                    onClick={isListeningMode ? startListening : startStudy}
                    disabled={filteredCount === 0}
                    className={`w-full text-white py-4 rounded-xl font-bold text-xl shadow-lg transition flex justify-center items-center gap-2 ${filteredCount === 0 ? 'bg-gray-300 cursor-not-allowed text-gray-500 shadow-none' : (isListeningMode ? 'bg-purple-600 hover:bg-purple-700' : 'bg-indigo-600 hover:bg-indigo-700')}`}
                  >
                    {isListeningMode ? <Headphones fill="currentColor"/> : <Play fill="currentColor"/>} 
                    {isListeningMode ? '聞き流しスタート' : '学習スタート'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderStudy = () => {
        const word = studyQueue[currentIndex];
        if (!word) return null;

        const progress = ((currentIndex) / studyQueue.length) * 100;

        return (
          <div className="max-w-md mx-auto h-full flex flex-col items-center justify-center pt-8 pb-20 fade-in">
            <div className="w-full mb-8">
              <div className="flex justify-between text-sm text-gray-500 mb-2 font-medium">
                <span>Progress</span>
                <span>{currentIndex + 1} / {studyQueue.length}</span>
              </div>
              <div className="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
                <div className="h-full bg-indigo-500 transition-all duration-300" style={{ width: `${progress}%` }}></div>
              </div>
            </div>

            <div 
              className="w-full aspect-[4/3] cursor-pointer mb-8 relative bg-white border border-gray-200 rounded-3xl shadow-md flex flex-col items-center justify-center p-6 text-center hover:border-indigo-300 transition-colors"
              onClick={() => setIsFlipped(!isFlipped)}
            >
              <button 
                onClick={(e) => { e.stopPropagation(); speak(word.english); }}
                className="absolute top-4 right-4 p-3 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition z-10"
              >
                <Volume2 size={24} />
              </button>
              
              <div className="absolute top-6 left-6 text-left">
                 {word.category && <div className="text-xs font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded inline-block mb-1">{word.category}</div>}
                 {word.serialNumber && <div className="text-xs text-gray-400 font-mono">No.{word.serialNumber}</div>}
              </div>

              {!isFlipped ? (
                <>
                  <h1 className="text-4xl sm:text-5xl font-bold text-gray-800 mb-4 tracking-tight mt-6">{word.english}</h1>
                  <span className="text-gray-400 text-sm mt-4">タップして答えを見る</span>
                </>
              ) : (
                <>
                  <h1 className="text-3xl sm:text-4xl font-bold text-gray-800 mb-6 mt-6">{word.english}</h1>
                  <div className="w-16 h-1 bg-indigo-200 rounded-full mb-6"></div>
                  <h2 className="text-3xl sm:text-4xl font-bold text-indigo-600 leading-tight">{word.japanese}</h2>
                </>
              )}
            </div>

            <div className="w-full">
              {!isFlipped ? (
                <button 
                  onClick={() => setIsFlipped(true)}
                  className="w-full bg-gray-800 hover:bg-gray-900 text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition"
                >
                  答えを見る
                </button>
              ) : (
                <div className="flex gap-4 fade-in">
                  <button 
                    onClick={() => handleAnswer(false)}
                    className="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition flex justify-center items-center gap-2"
                  >
                    <X size={24} /> 分からなかった
                  </button>
                  <button 
                    onClick={() => handleAnswer(true)}
                    className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition flex justify-center items-center gap-2"
                  >
                    <Check size={24} /> 分かった
                  </button>
                </div>
              )}
            </div>

            <button 
              onClick={() => finishStudy()}
              className="mt-8 text-gray-400 hover:text-gray-600 text-sm font-medium transition"
            >
              学習を途中で終了する
            </button>
          </div>
        );
      };

      const renderResult = () => {
        const total = sessionResults.length;
        const correct = sessionResults.filter(r => r.isCorrect).length;
        const score = total > 0 ? Math.round((correct / total) * 100) : 0;

        return (
          <div className="max-w-2xl mx-auto space-y-8 fade-in text-center pt-8">
            <h2 className="text-3xl font-bold text-gray-800">学習完了！</h2>
            
            <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center">
              <div className="text-gray-500 font-medium mb-2">今回の正答率</div>
              <div className="text-6xl font-black text-indigo-600 mb-6">{score}<span className="text-3xl">%</span></div>
              
              <div className="flex gap-8 w-full justify-center text-lg">
                 <div className="flex flex-col items-center">
                    <span className="text-emerald-500 font-bold flex items-center gap-1"><Check size={20}/> 正解</span>
                    <span className="text-2xl font-bold text-gray-800">{correct} <span className="text-sm text-gray-500 font-normal">問</span></span>
                 </div>
                 <div className="flex flex-col items-center">
                    <span className="text-rose-500 font-bold flex items-center gap-1"><X size={20}/> 不正解</span>
                    <span className="text-2xl font-bold text-gray-800">{total - correct} <span className="text-sm text-gray-500 font-normal">問</span></span>
                 </div>
              </div>
            </div>

            <div className="text-left bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
               <h3 className="p-4 bg-gray-50 border-b border-gray-100 font-bold text-gray-700">学習した単語</h3>
               <ul className="divide-y divide-gray-100 max-h-96 overflow-y-auto">
                 {sessionResults.map((res, i) => (
                   <li key={i} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-gray-50 transition gap-2">
                     <div>
                       <div className="flex items-center gap-2 mb-1">
                         <span className="font-bold text-gray-800 text-lg">{res.word.english}</span>
                         {res.word.category && <span className="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">{res.word.category}</span>}
                       </div>
                       <div className="text-gray-500 text-sm">{res.word.japanese}</div>
                     </div>
                     <div>
                       {res.isCorrect ? 
                         <span className="inline-flex items-center gap-1 text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full text-sm font-bold"><Check size={16}/> 正解</span> : 
                         <span className="inline-flex items-center gap-1 text-rose-600 bg-rose-50 px-3 py-1 rounded-full text-sm font-bold"><X size={16}/> 不正解</span>
                       }
                     </div>
                   </li>
                 ))}
               </ul>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8">
              {(total - correct) > 0 && (
                <button 
                  onClick={handleRetryIncorrect}
                  className="bg-rose-50 border-2 border-rose-400 text-rose-600 hover:bg-rose-100 px-4 py-3 rounded-xl font-bold text-lg transition flex items-center justify-center gap-2 shadow-sm"
                >
                  <X size={20}/> 間違えた問題のみ復習
                </button>
              )}
              <button 
                onClick={handleRetrySession}
                className="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-4 py-3 rounded-xl font-bold text-lg transition flex items-center justify-center gap-2 shadow-sm"
              >
                <RefreshCw size={20}/> もう一度繰り返す
              </button>
              <button 
                onClick={handleContinueLearning}
                className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-xl font-bold text-lg shadow-md transition flex items-center justify-center gap-2"
              >
                <SkipForward size={20}/> 続ける
              </button>
              <button 
                onClick={() => changeView('dashboard')}
                className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold text-lg transition flex items-center justify-center gap-2 shadow-sm"
              >
                <Home size={20}/> ホーム
              </button>
            </div>
          </div>
        );
      };

      const renderListening = () => {
        const word = listeningState.queue[listeningState.currentIndex];
        if (!word) {
          return (
            <div className="max-w-md mx-auto h-full flex flex-col items-center justify-center pt-20 text-center fade-in">
               <div className="w-24 h-24 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mb-6">
                 <Check size={48} />
               </div>
               <h2 className="text-2xl font-bold text-gray-800 mb-2">聞き流し完了</h2>
               <p className="text-gray-500 mb-8">すべての単語の再生が終わりました。</p>
               <button 
                 onClick={() => changeView('dashboard')}
                 className="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition"
               >
                 ダッシュボードへ
               </button>
            </div>
          );
        }

        const progress = ((listeningState.currentIndex) / listeningState.queue.length) * 100;

        return (
          <div className="max-w-md mx-auto h-full flex flex-col items-center justify-center pt-8 pb-20 fade-in">
            <div className="w-full mb-12">
              <div className="flex justify-between text-sm text-gray-500 mb-2 font-medium">
                <span>Listening Progress</span>
                <span>{listeningState.currentIndex + 1} / {listeningState.queue.length}</span>
              </div>
              <div className="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
                <div className="h-full bg-purple-500 transition-all duration-300" style={{ width: `${progress}%` }}></div>
              </div>
            </div>

            <div className="w-full bg-white p-10 rounded-3xl shadow-lg border border-purple-100 text-center mb-12 relative">
               <div className="absolute top-4 left-4 text-left">
                 {word.category && <div className="text-xs font-bold text-purple-500 bg-purple-50 px-2 py-1 rounded inline-block mb-1">{word.category}</div>}
                 {word.serialNumber && <div className="text-xs text-gray-400 font-mono">No.{word.serialNumber}</div>}
               </div>

               <Headphones className="mx-auto text-purple-200 mb-6 mt-4" size={48} />
               <h1 className="text-4xl sm:text-5xl font-black text-gray-800 mb-4">{word.english}</h1>
               <h2 className="text-2xl text-purple-600 font-bold">{word.japanese}</h2>
            </div>

            <div className="w-full bg-white p-6 rounded-3xl shadow-sm border border-purple-100 mb-8">
              <div className="flex justify-between items-center mb-2">
                <label className="text-sm font-bold text-gray-700">読み上げスピード ({settings.speechRate.toFixed(1)}x)</label>
              </div>
              <input 
                type="range" min="0.5" max="2.0" step="0.1" 
                className="w-full accent-purple-600"
                value={settings.speechRate}
                onChange={(e) => setSettings({...settings, speechRate: parseFloat(e.target.value)})}
              />
              <div className="flex justify-between text-xs text-gray-400 mt-1">
                <span>0.5x</span>
                <span>1.0x</span>
                <span>2.0x</span>
              </div>
            </div>

            <div className="flex items-center gap-6">
               <button 
                 onClick={() => {
                   if(listeningState.currentIndex > 0) {
                     window.speechSynthesis.cancel();
                     setListeningState(p => ({ ...p, currentIndex: p.currentIndex - 1 }));
                   }
                 }}
                 className="p-4 bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded-full transition"
               >
                 <SkipBack fill="currentColor" size={24} />
               </button>
               
               <button 
                 onClick={() => {
                    if(listeningState.isPlaying) {
                      window.speechSynthesis.cancel();
                    }
                    setListeningState(p => ({ ...p, isPlaying: !p.isPlaying }));
                 }}
                 className="p-6 bg-purple-600 text-white hover:bg-purple-700 rounded-full shadow-lg transition transform hover:scale-105"
               >
                 {listeningState.isPlaying ? <Pause fill="currentColor" size={32} /> : <Play fill="currentColor" className="ml-1" size={32} />}
               </button>

               <button 
                 onClick={() => {
                   if(listeningState.currentIndex < listeningState.queue.length - 1) {
                     window.speechSynthesis.cancel();
                     setListeningState(p => ({ ...p, currentIndex: p.currentIndex + 1 }));
                   }
                 }}
                 className="p-4 bg-gray-100 text-gray-600 hover:bg-gray-200 hover:text-gray-800 rounded-full transition"
               >
                 <SkipForward fill="currentColor" size={24} />
               </button>
            </div>

            <button 
              onClick={() => {
                window.speechSynthesis.cancel();
                changeView('dashboard');
              }}
              className="mt-12 text-gray-400 hover:text-gray-600 text-sm font-medium transition"
            >
              聞き流しを終了する
            </button>
          </div>
        );
      };

      return (
        <div 
          onTouchStart={handleGlobalTouchStart}
          onTouchEnd={handleGlobalTouchEnd}
        >
          <style>{`
            .fade-in { animation: fadeIn 0.3s ease-out forwards; }
            .slide-in-right { animation: slideInRight 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
            .slide-in-left { animation: slideInLeft 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            @keyframes slideInRight {
              from { opacity: 0; transform: translateX(30px); }
              to { opacity: 1; transform: translateX(0); }
            }
            @keyframes slideInLeft {
              from { opacity: 0; transform: translateX(-30px); }
              to { opacity: 1; transform: translateX(0); }
            }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
          `}</style>
          
          <Navigation />
          
          <main className="max-w-4xl mx-auto px-4 pb-12 overflow-x-hidden">
            {view === 'dashboard' && renderDashboard()}
            {view === 'import' && renderDataManagement()}
            {view === 'setup' && renderSetupForm(false)}
            {view === 'listening_setup' && renderSetupForm(true)}
            {view === 'study' && renderStudy()}
            {view === 'result' && renderResult()}
            {view === 'listening' && renderListening()}
          </main>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-gray-800 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 z-50 fade-in border border-gray-700">
              <Info size={20} className="text-indigo-400" />
              <span className="font-medium">{toast.message}</span>
            </div>
          )}

          {/* Confirm Dialog */}
          {confirmDialog && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 fade-in p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
                <h3 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
                  <AlertCircle className="text-rose-500" size={24} />
                  確認
                </h3>
                <p className="text-gray-600 mb-8">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-end">
                  <button 
                    onClick={() => setConfirmDialog(null)}
                    className="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={confirmDialog.onConfirm}
                    className="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold shadow-sm transition"
                  >
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
